[project]
name = "data-use-ce"
version = "0.1.0"
description = "Civic-education lesson on how personal data can be misused in automated selection"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lightning>=2.6",
    "matplotlib",
    "pandas",
    "pyyaml",
    "scikit-learn>=1.9",
    "torch==2.7.1",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "nbconvert",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_use_ce"]

# PyTorch from the CUDA 11.8 index on Linux: only these wheels still ship kernels for the
# oldest GPU generation (compute capability 3.7); the CUDA 12.x wheels drop it. The driver
# only needs to support CUDA 11.8 or newer. Other platforms use the default PyPI wheels.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
